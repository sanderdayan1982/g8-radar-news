name: Update Radar News G8 & IRIS Feed (5m)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-news-g8-sync
  cancel-in-progress: false

jobs:
  sync-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect G8 FX Feeds & Run Deterministic IRIS/MMT Classifier (Zero LLM)
        id: sync
        run: node scripts/sync_feeds.mjs

      - name: Commit & Push updated JSON feeds (with [skip netlify] lock)
        if: steps.sync.outputs.updated == 'true'
        run: |
          git config user.name "radarnews-g8-bot"
          git config user.email "radarnews-g8-bot@users.noreply.github.com"
          git add public/data/radar_news_full.json public/data/iris_g8_feed.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(feed): sync radar news [skip netlify]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No changes to commit."
          fi
