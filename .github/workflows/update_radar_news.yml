name: Update Radar News G8 & IRIS Feed (5m)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-news-g8-sync
  cancel-in-progress: false

jobs:
  sync-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Gate: never publish from an engine that fails its own contract (dependency-free suites, < 2 s).
      - name: Gate — engine, Mosler rules and data contracts
        run: node --test test/classify.test.js test/evidence.test.js test/integrity.test.js test/calibrationClosure.test.js test/sources.test.js test/financialjuice.test.js test/iris_serverless.test.js test/ui.test.js test/source_health.test.js

      - name: Collect G8 FX Feeds & Run Deterministic IRIS/MMT Classifier (Zero LLM)
        id: sync
        run: node scripts/sync_feeds.mjs

      # The heartbeat (radar_status.json) is committed on every run; full feeds only when content changed.
      - name: Commit & Push updated JSON feeds (with [skip netlify] lock)
        run: |
          git config user.name "radarnews-g8-bot"
          git config user.email "radarnews-g8-bot@users.noreply.github.com"
          git add public/data/radar_news_full.json public/data/iris_g8_feed.json public/data/radar_status.json
          if git diff --staged --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "chore(feed): sync radar news [skip netlify]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts"; exit 1
