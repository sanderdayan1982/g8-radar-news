name: Update Radar News G8 & IRIS Feed (5m)

# GitHub runs */5 schedules on a best-effort basis (often 15-60+ min late or skipped).
# Reliable, free design: an hourly trigger (plus a half-hour backup) starts a ~57-minute job that
# syncs on its own clock (scripts/sync_loop.sh): every 5 min, every 60 s near High-impact events.
# The legacy */5 trigger is kept as an extra wake-up; concurrency never runs two loops at once.
# Observed 2026-11-08: GitHub fired no scheduled run for 4 h after 02:18 UTC. So each successful loop
# dispatches the next one (workflow_dispatch via GITHUB_TOKEN is allowed to start a run). Schedules
# remain only as a restart if the chain breaks. A failing gate stops the chain (fail closed, no hot loop).
on:
  schedule:
    - cron: '3 * * * *'
    - cron: '33 * * * *'
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # self-chaining: each loop dispatches the next one

concurrency:
  group: radar-news-g8-sync
  cancel-in-progress: false

jobs:
  sync-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Gate: never publish from an engine that fails its own contract (dependency-free suites, < 2 s).
      - name: Gate — engine, Mosler rules and data contracts
        run: node --test test/classify.test.js test/evidence.test.js test/integrity.test.js test/calibrationClosure.test.js test/sources.test.js test/financialjuice.test.js test/iris_serverless.test.js test/locks.test.js test/ui.test.js test/source_health.test.js test/scheduler.test.js test/retention.test.js test/silence.test.js test/polymarket_geo.test.js test/live_base.test.js

      # Commits keep the lock message "chore(feed): sync radar news [skip netlify]" (see scripts/sync_loop.sh).
      - name: Sync loop (5 min cadence, 60 s near High events)
        run: bash scripts/sync_loop.sh

      - name: Chain the next loop
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update_radar_news.yml --ref main
