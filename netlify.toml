[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'Static + Serverless Functions deploy (0 build minutes)'"
  # t389u: mismo criterio que h8-h15-monitor #6 y dts-tracker #15.
  # Solo se publica si cambia código/HTML/funciones/netlify.toml, no public/data.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- 'public/**' ':!public/data/**' 'netlify/**' netlify.toml SPEC.md"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/data/*.json", "SPEC.md"]

[[redirects]]
  from = "/api/iris-feed"
  to = "/.netlify/functions/radar_live"
  status = 200
  force = true

[[redirects]]
  from = "/api/radar-full"
  to = "/.netlify/functions/radar_live"
  status = 200
  force = true

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/radar_live"
  status = 200
  force = true

[[redirects]]
  from = "/api/refresh"
  to = "/.netlify/functions/radar_live?refresh=1"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/radar_live"
  status = 200
  force = true

[[redirects]]
  from = "/api/spec"
  to = "/.netlify/functions/radar_live"
  status = 200
  force = true

[[headers]]
  for = "/data/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-store, no-cache, must-revalidate"
